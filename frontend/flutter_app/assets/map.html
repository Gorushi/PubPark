
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6ff5862f3b23c7383d8586db1f0f93c1&autoload=false"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    function reportStatus(message) {
        console.log("[KakaoMap] " + message);

        if (window.flutter_inappwebview) {
            window.flutter_inappwebview.callHandler(
                "mapStatus",
                message
            );
        }
    }

    window.addEventListener("error", function(event) {
        reportStatus("JavaScript error: " + event.message);
    });

    if (typeof kakao === "undefined") {
        reportStatus("Kakao SDK failed to load");
    } else {
        kakao.maps.load(function() {
            try {
                var container = document.getElementById("map");

                var options = {
                    center: new kakao.maps.LatLng(36.6358, 127.4914),
                    level: 3
                };

                var map = new kakao.maps.Map(container, options);

                window.parkingMap = map;

                kakao.maps.event.addListener(map, "tilesloaded", function() {
                    reportStatus("Map tiles loaded");
                });

                reportStatus("Map initialized");
            } catch (error) {
                reportStatus("Map initialization failed: " + error.message);
            }
        });
    }
</script>
</body>
</html>
